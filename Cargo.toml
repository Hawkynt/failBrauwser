[package]
name = "failbrauwser"
version = "0.4.0"
edition = "2024"
description = "A fast, native GTK3 file manager that can browse and edit archives"
license = "GPL-3.0-or-later"

[[bin]]
name = "failbrauwser"
path = "src/main.rs"

[lib]
name = "failbrauwser"
path = "src/lib.rs"

[dependencies]
async-channel = "2"
gtk = { version = "0.19", features = ["v3_24"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
