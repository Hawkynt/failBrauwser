[package]
name = "failbrauwser"
version = "0.6.0"
edition = "2024"
description = "A fast, native GTK3 file manager that can browse and edit archives"
license = "GPL-3.0-or-later"

[[bin]]
name = "failbrauwser"
path = "src/main.rs"

[lib]
name = "failbrauwser"
path = "src/lib.rs"

[dependencies]
async-channel = "2"
gtk = { version = "0.19", features = ["v3_24"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
md-5 = "0.11"
sha2 = "0.11"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
# M7 will add the remote stack then: russh (ring backend — aws-lc needs NASM) + russh-sftp + suppaftp + tokio

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
